# Configuração do motor booprecognition.

# Banco usado pelo motor: firestore | mongodb | sqlite | memory
target: firestore
project: booprecognition

setup-alg:
  knn_k: 5                    # vizinhos consultados na busca KNN
  match_threshold: 0.5        # precision mínima para reconhecer a pessoa
  min_top_similarity: 0.55    # o vizinho mais próximo do vencedor precisa ser ao menos isso
  min_margin: 0.08            # vencedor precisa superar a 2ª pessoa por essa diferença
  update_threshold: 0.65      # identificação só salva o rosto no histórico acima disso
  min_neighbor_similarity: 0.4  # vizinhos abaixo disso são outra pessoa e não votam
  duplicate_threshold: 0.45   # cadastro: similaridade a partir da qual é a mesma pessoa
  max_embeddings_person: 10   # tamanho do histórico FIFO por pessoa
  encoder_models: [buffalo_l] # InsightFace; ensemble: [buffalo_l, antelopev2] (1024-d)
  min_det_score: 0.6          # recusa rostos borrados/artificiais
  max_yaw_ratio: 0.45         # recusa rostos muito de perfil
  id_digits: 9                # dígitos do identificador aleatório

databases:
  firestore:
    project_id: booprecognition                     
    credentials_env: GOOGLE_APPLICATION_CREDENTIALS
    collections:
      persons: boop-persons
      embeddings: boop-embeddings-history

  mongodb:
    uri_env: BOOP_MONGODB_URI   
    database: booprecognition
    collections:
      persons: boop-persons
      embeddings: boop-embeddings-history
    use_transactions: true      # Desligue em Mongo standalone
    vector_search:
      mode: atlas               # atlas ($vectorSearch) | brute_force (cosseno em Python, dev)
      index_name: boop_vector_index
      num_candidates: 100       # candidatos avaliados pelo HNSW antes do top-K

  sqlite:
    path: ./data/booprecognition.db   # arquivo local; a pasta é criada automaticamente
    path_env: BOOP_SQLITE_PATH        # se definida, sobrescreve o path
    tables:
      persons: boop_persons
      embeddings: boop_embeddings_history
    vector_search:
      mode: brute_force               # brute_force (numpy em memória) | sqlite_vec (extensão)
      dimension: 512

# OAuth 2.0 (client_credentials) com access token JWT
auth:
  enabled: true
  secret_env: BOOP_JWT_SECRET         # chave de assinatura (>= 32 bytes)
  algorithm: HS256
  issuer: booprecognition
  audience: booprecognition-api
  access_token_ttl_seconds: 0         # 0 = token não expira
  clients:
    - client_id: boop-admin
      secret_env: BOOP_CLIENT_ADMIN_SECRET
      scopes: [identify, persons:write, persons:delete]
