[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "booprecognition"
version = "0.1.0"
description = "Motor agnóstico de reconhecimento facial com embeddings no Firestore"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pydantic-settings>=2.2",
]

[project.optional-dependencies]
encoder = ["insightface>=0.7.3", "onnxruntime>=1.17", "opencv-python-headless>=4.9"]
firestore = ["google-cloud-firestore>=2.16"]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "python-multipart>=0.0.9"]
dev = ["pytest>=8", "ruff>=0.4", "mypy>=1.10", "httpx>=0.27"]
all = ["booprecognition[encoder,firestore,api]"]

[project.scripts]
booprecognition = "booprecognition.interfaces.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["integration: requer Firestore/encoder reais"]
addopts = "-m 'not integration'"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.ruff.lint.per-file-ignores]
"src/booprecognition/interfaces/http/*" = ["B008"]
